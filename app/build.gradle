plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mcpe.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mcpe.client'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    ndkVersion '27.2.12479018'

    buildTypes {
        debug {
            debuggable true
        }
    }
}
